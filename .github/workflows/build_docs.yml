name: build_docs

on:
  workflow_dispatch:

concurrency:
  group: build-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # 统一用UTF-8, 防止locale不是UTF-8时打印中文出错
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Sphinx 9.x要求Python>=3.13
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Show versions
        run: |
          doxygen --version
          python --version

      - name: Install python dependencies
        run: python -m pip install -r requirements.txt

      # 用仓库里的脚本构建, 本地和 CI 走同一套命令;
      # 脚本内部把Sphinx警告当成错误(-W), 并且以仓库根目录为工作目录
      - name: Build docs
        run: python script/build_docs/build_docs.py --clean

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/html
          retention-days: 7

  deploy:
    name: deploy to GitHub Pages
    # 手动触发没有 push 事件, 所以只能看分支: 在默认分支上跑才发布, 其他分支只做构建验证。
    # 不写死 dev, 直接取仓库的默认分支, 以后换主干也不用改这里
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download docs
        uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: docs/html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
