name: docs

on:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    # Windows 上 Python 接管道时用系统 ANSI 代码页(cp1252), 脚本和 Sphinx 打印中文会抛 UnicodeEncodeError
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Sphinx 9.x要求Python>=3.13
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install doxygen (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install doxygen (macOS)
        if: runner.os == 'macOS'
        run: brew install doxygen

      - name: Install doxygen (Windows)
        if: runner.os == 'Windows'
        run: choco install doxygen.install -y --no-progress

      # 三个平台的命令用同一套写法, Windows 的 runner 自带 bash
      - name: Show versions
        shell: bash
        run: |
          doxygen --version
          python --version

      - name: Install python dependencies
        run: python -m pip install -r requirements.txt

      # 用仓库里的脚本构建, 本地和 CI 走同一套命令;
      # 脚本内部把Sphinx警告当成错误(-W), 并且以仓库根目录为工作目录
      - name: Build docs
        shell: bash
        run: python script/build_docs/build_docs.py --clean

      - name: Upload docs
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/html
          retention-days: 7

  deploy:
    name: deploy to GitHub Pages
    # 手动触发没有 push 事件, 所以只看分支: 在 main 上手动跑才发布, 其他分支只做构建验证
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download docs
        uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: docs/html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
